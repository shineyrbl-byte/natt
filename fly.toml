# Fly.io config for the public demo (simulated wallet, no real bitcoin).
# Deploy with: fly deploy
app = "natt-dakar"
primary_region = "cdg" # Paris: the lowest-latency Fly region from Dakar

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LIGHTNING_BACKEND = "simulated"
  SEED_DEMO = "1"
  PUBLIC_DEMO = "1"
  LIVE_RATE = "1"
  PUBLIC_URL = "https://natt-dakar.fly.dev"

# No volume on purpose: each fresh machine starts with a clean demo group.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
